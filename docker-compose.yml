services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      MUTZ_ALLOW_MODEL_DOWNLOAD: "0"   # never pull 4.5 GB over the venue link; models come via the volume
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./assets/private:/app/assets/private:ro
      - models:/root/.cache/huggingface     # BGE M3 and reranker download once
